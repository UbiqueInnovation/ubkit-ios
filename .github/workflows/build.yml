name: Build & Test

env:
  XCVERSION: "27.2"

on:
  push:

jobs:
  tests:
    name: Tests
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      - name: Switch to ${{ env.XCVERSION }}
        run: sudo xcodes select ${{ env.XCVERSION }}

      - name: Fastlane
        run: fastlane tests

      - uses: slidoapp/xcresulttool@v3.1.0
        with:
          path: build/UBKit-Package.xcresult
        if: always()
